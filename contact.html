<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | INDIAN EXCELLENCE, REWA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header placeholder -->
    <div id="header-placeholder"></div>

    <!-- Auth Panel placeholder -->
    <div id="authpanel-placeholder"></div>

    <section class="kps-page-banner page-top-space">
        <div class="container text-center">
            <span class="kps-badge">Contact Us</span>
            <h1>We'd love to hear from you</h1>
            <p class="mx-auto">Reach INDIAN EXCELLENCE for admissions, support, and school information.</p>
        </div>
    </section>

    <section class="kps-section contact-redesign">
        <div class="container">
            <div class="kps-contact-info-bar">
                <div class="kps-contact-info-item">
                    <i class="bi bi-geo-alt-fill"></i>
                    <p>REWA,  MP</p>
                </div>
                <div class="kps-contact-info-item">
                    <i class="bi bi-envelope-fill"></i>
                    <p><a href="mailto:indianexcellence@gmail.com" class="contact-link">indianexcellence@gmail.com</a></p>
                </div>
                <div class="kps-contact-info-item">
                    <i class="bi bi-telephone-fill"></i>
                    <p><a href="tel:+919583344888" class="contact-link">+91 9583344888</a></p>
                </div>
                <div class="kps-contact-info-item">
                    <i class="bi bi-clock-fill"></i>
                    <p>Mon–Sat: 9:00 AM – 4:00 PM</p>
                </div>
            </div>

            <div class="row g-4 align-items-stretch">
                <div class="col-lg-5">
                    <div class="kps-contact-map-wrap h-100">
                        <div class="ratio ratio-4x3 h-100">
                            <iframe src="https://www.google.com/maps?q=REWA%2C%20 MP&output=embed" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="kps-contact-form h-100">
                        <h4 class="mb-3">Send Enquiry</h4>
                        <form id="contactForm">
                            <div class="row g-3">
                                <div class="col-md-6"><input type="text" class="form-control" placeholder="Parent Name" required></div>
                                <div class="col-md-6"><input type="email" class="form-control" placeholder="Email Address" required></div>
                                <div class="col-md-6"><input type="tel" class="form-control" placeholder="+91 0000000000" required></div>
                                <div class="col-md-6"><input type="text" class="form-control" placeholder="Subject" required></div>
                                <div class="col-12"><textarea class="form-control" rows="5" placeholder="Write your message" required></textarea></div>
                                <div class="col-12"><button type="submit" class="btn btn-primary px-4">Submit Enquiry</button></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" class="btn btn-primary back-to-top" type="button">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/911234567890" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Load Components -->
    <script src="js/load-components.js"></script>
    <!-- Main Script -->
    <script src="js/script.js"></script>
</body>
</html>
